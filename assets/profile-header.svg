<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="350" viewBox="0 0 1400 350" role="img" aria-labelledby="title desc">
  <title id="title">Analice Leite — I build the whole thing</title>
  <desc id="desc">A cream, navy, lavender, and yellow banner matching Analice's LinkedIn identity: Design, Build, Ship, and her A monogram.</desc>
  <defs>
    <g id="hex-outline">
      <polygon points="0,-47 41,-24 41,24 0,47 -41,24 -41,-24" fill="none" stroke="#d8d1c3" stroke-width="2"/>
    </g>
  </defs>

  <rect width="1400" height="350" rx="8" fill="#f6f2e9"/>

  <!-- A faint honeycomb edge, echoing the LinkedIn banner -->
  <g opacity="0.72">
    <use href="#hex-outline" x="48" y="32"/>
    <use href="#hex-outline" x="130" y="80"/>
    <use href="#hex-outline" x="48" y="128"/>
    <use href="#hex-outline" x="130" y="176"/>
    <use href="#hex-outline" x="48" y="224"/>
    <use href="#hex-outline" x="130" y="272"/>
    <use href="#hex-outline" x="212" y="32"/>
    <use href="#hex-outline" x="212" y="224"/>
  </g>

  <text x="335" y="121" fill="#050b3d" font-family="Arial, Helvetica, sans-serif" font-size="68" font-weight="700" letter-spacing="-2.5">I build the</text>
  <text x="335" y="190" fill="#050b3d" font-family="Arial, Helvetica, sans-serif" font-size="68" font-weight="700" letter-spacing="-2.5">whole thing.</text>
  <text x="338" y="243" fill="#050b3d" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="600">Analice Leite · Software Engineer</text>
  <text x="338" y="280" fill="#555862" font-family="Arial, Helvetica, sans-serif" font-size="22">C# / .NET · Angular · TypeScript · Cloud</text>

  <!-- Design / Build / Ship: a small map of how Analice works -->
  <g font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" text-anchor="middle">
    <polygon points="1050,42 1091,65 1091,113 1050,136 1009,113 1009,65" fill="#b9a8dd"/>
    <text x="1050" y="94" fill="#050b3d">Design</text>

    <polygon points="1150,42 1191,65 1191,113 1150,136 1109,113 1109,65" fill="#050b3d"/>
    <text x="1150" y="94" fill="#fdfbf5">Build</text>

    <polygon points="1100,130 1141,153 1141,201 1100,224 1059,201 1059,153" fill="#ffb020"/>
    <text x="1100" y="182" fill="#050b3d">Ship</text>

    <polygon points="1200,130 1241,153 1241,201 1200,224 1159,201 1159,153" fill="#fdfbf5" stroke="#b9a8dd" stroke-width="5"/>
  </g>
  <g transform="translate(1150 126)">
    <g transform="translate(50 51) scale(1.22) translate(-50 -51)">
      <path d="M39 30.3 49.5 61h-5.3l-2.4-7.5h-5.6L33.8 61h-5.3L39 30.3Zm0 5.5-1.8 13h3.6L39 35.8Z" transform="translate(11 5)" fill="#050b3d"/>
    </g>
  </g>

</svg>
